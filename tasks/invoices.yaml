name: invoices
description: Extract key fields from messy, inconsistently formatted invoice text.
data: data/invoices.jsonl
fields:
  - name: invoice_number
    type: string
    rules: [required, unique]
  - name: customer
    type: string
    rules: [required]
  - name: date
    type: date
    rules: [required, not_future]
  - name: total
    type: number
    rules: [required, non_negative]
