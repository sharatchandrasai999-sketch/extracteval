[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "extracteval"
version = "0.1.0"
description = "Schema-driven extraction + evaluation framework for LLMs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
llm = ["anthropic>=0.40.0"]
app = ["streamlit>=1.40.0"]
dev = ["pytest>=8.0"]

[project.scripts]
extracteval = "extracteval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
